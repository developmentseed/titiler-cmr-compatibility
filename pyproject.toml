[project]
name = "titiler-cmr-compatibility"
version = "0.1.0"
description = "Compatibility tooling for testing NASA Earth data collections with TiTiler-CMR."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3",
    "duckdb>=1.5.4",
    "earthaccess>=0.15.0",
    "httpx2",
    "lithops",
    "numcodecs==0.16.3",
    "numpy",
    "pandas",
    "pyarrow>=24.0.0",
    "PyYAML",
    "tenacity",
    "tqdm>=4.68.3",
    "typer>=0.26.8",
]

[project.scripts]
titiler-cmr-assessment = "titiler_cmr_compatibility.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["titiler_cmr_compatibility"]

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = [
    "ipython>=9.15.0",
    "jupyterlab>=4.6.1",
    "pytest>=9.1.1",
]
